<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" style="background-color: rgb(245, 241, 237)" data-real-to-screen-transform="matrix(300,0,0,-300,600,300)"><style>
              .boundary { fill: rgb(245, 241, 237); }
              .schematic-boundary { fill: none; stroke: #fff; }
              .component { fill: none; stroke: rgb(132, 0, 0); }
              .chip { fill: rgb(255, 255, 194); stroke: rgb(132, 0, 0); }
              .component-pin { fill: none; stroke: rgb(132, 0, 0); }
              /* Basic per-trace hover fallback */
              .trace:hover {
                filter: invert(1);
              }
              .trace:hover .trace-crossing-outline {
                opacity: 0;
              }
              .trace:hover .trace-junction {
                filter: invert(1);
              }
              /* Net-hover highlighting: when a trace or its overlays are hovered,
                 invert color for all traces (base + overlays) sharing the same
                 subcircuit connectivity key. Also hide crossing outline during hover. */
              
              .text { font-family: sans-serif; fill: rgb(0, 150, 0); }
              .pin-number { fill: rgb(169, 0, 0); }
              .port-label { fill: rgb(0, 100, 100); }
              .component-name { fill: rgb(0, 100, 100); }
            </style><rect class="boundary" x="0" y="0" width="1200" height="600"/><g data-circuit-json-type="schematic_component" data-schematic-component-id="schematic_component_0"><rect class="component chip" x="450" y="150" width="300" height="300" stroke-width="6px" fill="rgb(255, 255, 194)" stroke="rgb(132, 0, 0)"/><rect class="component-overlay" x="450" y="150" width="300" height="300" fill="transparent"/></g><path class="net-label" d="
    M 650.1,300
    L 633.9,332.4
    L 499.78000000000003,332.4
    L 499.78000000000003,267.59999999999997
    L 633.9,267.6
    Z
  " fill="rgba(255, 255, 255, 0.6)" stroke="rgb(132, 0, 0)" stroke-width="6px"/><text class="net-label-text" x="623.1" y="300" fill="rgb(132, 0, 0)" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-variant-numeric="tabular-nums" font-size="54px" transform="">CLK</text></svg>