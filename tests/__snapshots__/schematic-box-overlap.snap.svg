<svg width="1200" height="790" viewBox="0 0 1200 790" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="schematic analysis fixture">
  <g transform="translate(0, 0)">
    <style>
              .boundary { fill: rgb(245, 241, 237); }
              .schematic-boundary { fill: none; stroke: #fff; }
              .component { fill: none; stroke: rgb(132, 0, 0); }
              .chip { fill: rgb(255, 255, 194); stroke: rgb(132, 0, 0); }
              .component-pin { fill: none; stroke: rgb(132, 0, 0); }
              /* Basic per-trace hover fallback */
              .trace:hover {
                filter: invert(1);
              }
              .trace:hover .trace-crossing-outline {
                opacity: 0;
              }
              .trace:hover .trace-junction {
                filter: invert(1);
              }
              /* Net-hover highlighting: when a trace or its overlays are hovered,
                 invert color for all traces (base + overlays) sharing the same
                 subcircuit connectivity key. Also hide crossing outline during hover. */
              
              .text { font-family: sans-serif; fill: rgb(0, 150, 0); }
              .pin-number { fill: rgb(169, 0, 0); }
              .port-label { fill: rgb(0, 100, 100); }
              .component-name { fill: rgb(0, 100, 100); }
            </style><rect class="boundary" x="0" y="0" width="1200" height="600"/><rect class="schematic-box" x="257.1428571429" y="171.4285714285" width="514.2857142857999" height="342.8571428572" stroke-width="3.4285714285720004px" stroke="rgb(132, 0, 0)" fill="transparent"/><rect class="schematic-box" x="428.57142857150006" y="85.7142857142" width="514.2857142857999" height="342.8571428572" stroke-width="3.4285714285720004px" stroke="rgb(132, 0, 0)" fill="transparent"/>
  </g>
  <g transform="translate(0, 600) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#fff" /><text x="18" y="40" fill="#d00" font-family="Menlo, Consolas, monospace" font-size="16"><tspan x="18" dy="0">&lt;SchematicBoxPositions&gt;</tspan><tspan x="18" dy="22">&lt;SchematicBoxPlacement positionAnchor=&quot;center&quot; schX=&quot;0&quot; schY=&quot;0&quot; width=&quot;3&quot; height=&quot;2&quot; /&gt;</tspan><tspan x="18" dy="22">&lt;SchematicBoxPlacement positionAnchor=&quot;center&quot; schX=&quot;1&quot; schY=&quot;0.5&quot; width=&quot;3&quot; height=&quot;2&quot; /&gt;</tspan><tspan x="18" dy="22">&lt;/SchematicBoxPositions&gt;</tspan><tspan x="18" dy="22">&lt;SchematicPlacementIssues&gt;</tspan><tspan x="18" dy="22">&lt;SchematicBoxOverlap firstSchX=&quot;0&quot; firstSchY=&quot;0&quot; secondSchX=&quot;1&quot; secondSchY=&quot;0.5&quot; overlapCenterSchX=&quot;0.5&quot; overlapCenterSchY=&quot;0.25&quot; overlapWidth=&quot;2&quot; overlapHeight=&quot;1.5&quot; /&gt;</tspan><tspan x="18" dy="22">&lt;/SchematicPlacementIssues&gt;</tspan></text>
  </g>
</svg>