<svg width="1200" height="724" viewBox="0 0 1200 724" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="schematic analysis fixture">
  <g transform="translate(0, 0)">
    <style>
              .boundary { fill: rgb(245, 241, 237); }
              .schematic-boundary { fill: none; stroke: #fff; }
              .component { fill: none; stroke: rgb(132, 0, 0); }
              .chip { fill: rgb(255, 255, 194); stroke: rgb(132, 0, 0); }
              .component-pin { fill: none; stroke: rgb(132, 0, 0); }
              /* Basic per-trace hover fallback */
              .trace:hover {
                filter: invert(1);
              }
              .trace:hover .trace-crossing-outline {
                opacity: 0;
              }
              .trace:hover .trace-junction {
                filter: invert(1);
              }
              /* Net-hover highlighting: when a trace or its overlays are hovered,
                 invert color for all traces (base + overlays) sharing the same
                 subcircuit connectivity key. Also hide crossing outline during hover. */
              
              .text { font-family: sans-serif; fill: rgb(0, 150, 0); }
              .pin-number { fill: rgb(169, 0, 0); }
              .port-label { fill: rgb(0, 100, 100); }
              .component-name { fill: rgb(0, 100, 100); }
            </style><rect class="boundary" x="0" y="0" width="1200" height="600"/><rect class="schematic-box" x="257.1428571429" y="171.4285714285" width="514.2857142857999" height="342.8571428572" stroke-width="3.4285714285720004px" stroke="rgb(132, 0, 0)" fill="transparent"/><rect class="schematic-box" x="428.57142857150006" y="85.7142857142" width="514.2857142857999" height="342.8571428572" stroke-width="3.4285714285720004px" stroke="rgb(132, 0, 0)" fill="transparent"/>
  </g>
  <g transform="translate(0, 600) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#fff" /><text x="18" y="40" fill="#d00" font-family="Menlo, Consolas, monospace" font-size="16"><tspan x="18" dy="0">1. schematic_box_overlap</tspan><tspan x="18" dy="22">   Schematic boxes schematic_component_a and schematic_component_b overlap by 2 x 1.500.</tspan><tspan x="18" dy="22">   boxes: schematic_component_a, schematic_component_b</tspan><tspan x="18" dy="22">   overlap center: (0.500, 0.250)</tspan></text>
  </g>
</svg>