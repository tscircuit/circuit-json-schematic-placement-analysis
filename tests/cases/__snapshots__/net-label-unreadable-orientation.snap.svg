    L 735.1315789473483,353.2894736842128
    L 491.51315789470635,353.2894736842128
    Z
  " fill="rgba(255, 255, 255, 0.6)" stroke="rgb(132, 0, 0)" stroke-width="9.868421052632px"/><text class="net-label-text" x="509.27631578944397" y="300" fill="rgb(132, 0, 0)" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-variant-numeric="tabular-nums" font-size="88.815789473688px" transform="">GND</text>
