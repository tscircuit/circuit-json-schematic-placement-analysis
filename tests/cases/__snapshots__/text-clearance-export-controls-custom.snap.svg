<svg width="1200" height="636" viewBox="0 0 1200 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="schematic analysis fixture">
  <g transform="translate(0, 0)">
    <style>
              .boundary { fill: rgb(245, 241, 237); }
              .schematic-boundary { fill: none; stroke: #fff; }
              .component { fill: none; stroke: rgb(132, 0, 0); }
              .chip { fill: rgb(255, 255, 194); stroke: rgb(132, 0, 0); }
              .component-pin { fill: none; stroke: rgb(132, 0, 0); }
              /* Basic per-trace hover fallback */
              .trace:hover {
                filter: invert(1);
              }
              .trace:hover .trace-crossing-outline {
                opacity: 0;
              }
              .trace:hover .trace-junction {
                filter: invert(1);
              }
              /* Net-hover highlighting: when a trace or its overlays are hovered,
                 invert color for all traces (base + overlays) sharing the same
                 subcircuit connectivity key. Also hide crossing outline during hover. */

              .text { font-family: sans-serif; fill: rgb(0, 150, 0); }
              .pin-number { fill: rgb(169, 0, 0); }
              .port-label { fill: rgb(0, 100, 100); }
              .component-name { fill: rgb(0, 100, 100); }

            </style><rect class="boundary" x="0" y="0" width="1200" height="600"/><g class="sch-component" data-circuit-json-type="schematic_component" data-schematic-component-id="schematic_component_0"><circle class="sch-circle" cx="647.2906403941" cy="304.4334975369" r="147.78325123155" fill="none" stroke="rgba(132, 0, 0)" stroke-width="5.911330049262" data-schematic-circle-id="schematic_circle_0" data-schematic-component-id="schematic_component_0"/></g><g class="schematic-port-hover sch-port-hover" data-schematic-port-id="source_port_0"><circle cx="410.83743842362003" cy="304.4334975369" r="11.822660098524" fill="red" opacity="0"/></g><text class="sch-text" x="789.162561576388" y="162.56157635461201" fill="#000000" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="29.55665024631px" transform="rotate(0, 789.162561576388, 162.56157635461201)">Q1</text>
  </g>
  <g transform="translate(0, 600) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="#fff" />
<text x="18" y="40" fill="#d00" font-family="Menlo, Consolas, monospace" font-size="16">
</text>
  </g>
</svg>