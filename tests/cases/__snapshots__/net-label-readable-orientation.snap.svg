    Z
  " fill="rgba(255, 255, 255, 0.6)" stroke="rgb(132, 0, 0)" stroke-width="7.634235304098px"/><text class="net-label-text" x="600" y="374.79005852915907" fill="rgb(132, 0, 0)" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-variant-numeric="tabular-nums" font-size="68.708117736882px" transform="rotate(-90 600 374.79005852915907)">V3_3</text>
